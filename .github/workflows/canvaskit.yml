name: CanvasKit

# Builds our CanvasKit (packages/canvaskit) when its recipe changes and publishes it as a GitHub
# release named after the recipe hash. CI and every install fetch that release by checksum
# (packages/canvaskit/release.json), so only a recipe change ever rebuilds. A pull request's
# builds are published so its own CI can fetch them; when it closes, the ones main doesn't use
# are deleted.
on:
  pull_request:
    types: [opened, synchronize, reopened, closed]
    paths: [packages/canvaskit/build/**, .github/workflows/canvaskit.yml]
  push:
    branches: [main]
    paths: [packages/canvaskit/build/**, .github/workflows/canvaskit.yml]
  workflow_dispatch:

concurrency:
  group: canvaskit-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    if: github.event.action != 'closed'
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - id: recipe
        run: |
          hash=$(node packages/canvaskit/recipe.mjs)
          echo "hash=$hash" >> "$GITHUB_OUTPUT"
          echo "tag=canvaskit-$hash" >> "$GITHUB_OUTPUT"
          if gh release view "canvaskit-$hash" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "built=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.recipe.outputs.built != 'true'
        run: bash packages/canvaskit/build/build.sh dist
        env:
          SKIA_DIR: ${{ runner.temp }}/skia
      - if: steps.recipe.outputs.built == 'true'
        run: gh release download "${{ steps.recipe.outputs.tag }}" --repo "$GITHUB_REPOSITORY" --dir dist --pattern 'canvaskit.*'
      - run: node packages/canvaskit/smoke.mjs dist
      - if: steps.recipe.outputs.built != 'true'
        run: |
          gh release create "${{ steps.recipe.outputs.tag }}" dist/canvaskit.js dist/canvaskit.wasm \
            --repo "$GITHUB_REPOSITORY" \
            --target "${{ github.event.pull_request.head.sha || github.sha }}" \
            --title "CanvasKit ${{ steps.recipe.outputs.hash }}" \
            --notes "CanvasKit from Skia $(cat packages/canvaskit/build/skia-commit) with the PDF and SVG backends, built from packages/canvaskit/build at recipe ${{ steps.recipe.outputs.hash }}${{ github.event.pull_request.number && format(' for pull request #{0}', github.event.pull_request.number) || '' }}."
      - run: |
          node -e '
            const { createHash } = require("node:crypto")
            const { readFileSync, writeFileSync } = require("node:fs")
            const files = {}
            for (const name of ["canvaskit.js", "canvaskit.wasm"]) files[name] = createHash("sha256").update(readFileSync(`dist/${name}`)).digest("hex")
            const release = { repo: process.env.GITHUB_REPOSITORY, tag: process.argv[1], recipe: process.argv[2], files }
            writeFileSync("dist/release.json", JSON.stringify(release, null, 2) + "\n")
          ' "${{ steps.recipe.outputs.tag }}" "${{ steps.recipe.outputs.hash }}"
          { echo '### packages/canvaskit/release.json'; echo '```json'; cat dist/release.json; echo '```'; ls -l dist >> /dev/stdout; } >> "$GITHUB_STEP_SUMMARY"
          cat dist/release.json
          ls -l dist
          gzip -9 -k dist/canvaskit.wasm dist/canvaskit.js && ls -l dist/*.gz
      - uses: actions/upload-artifact@v4
        with:
          name: canvaskit
          path: dist
          retention-days: 30

  # A closed pull request's builds, except the one main's release.json names.
  prune:
    if: github.event.action == 'closed'
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ github.token }}
      PR: ${{ github.event.pull_request.number }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
      - run: |
          keep=$(node -p 'require("./packages/canvaskit/release.json").tag')
          gh api "repos/$GITHUB_REPOSITORY/releases" --paginate --jq ".[] | select(.body | endswith(\" for pull request #$PR.\")) | .tag_name" |
          while read -r tag; do
            if [ "$tag" != "$keep" ]; then gh release delete "$tag" --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag; fi
          done
