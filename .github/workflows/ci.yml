name: CI

on:
  # A branch's commits are tested by its pull request; pushes are tested on main only, so no commit runs twice.
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # hb-shape, the reference the shaping checks (#7) compare Skia's glyphs against.
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libharfbuzz-bin
      - run: pnpm lint
      - run: pnpm typecheck
      # Postgres, the API and the sync server, from this checkout: the API's seam tests (#33) and the
      # sync server's run against them, and the API runs the migrations on start.
      - run: docker compose up -d --wait
      - run: pnpm test
      - run: pnpm --filter @dazbee/pixels exec playwright install --with-deps chromium
      - run: pnpm turbo run e2e --filter=@dazbee/pixels
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: pixel-diffs
          path: tests/pixels/output
          if-no-files-found: ignore
          retention-days: 7
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: webgl-vs-cpu
          path: tests/pixels/output/webgl-vs-cpu.md
          if-no-files-found: ignore
          retention-days: 30

  # The editor's browser suite took 40 minutes on one 2-core runner and grows with each ticket, so it
  # runs in shards side by side, each against its own API and sync server (#100).
  e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: docker compose up -d --wait
      - run: pnpm --filter @dazbee/e2e exec playwright install --with-deps chromium
      - run: pnpm turbo run build --filter=@dazbee/web
      - run: pnpm --filter @dazbee/e2e exec playwright test --shard=${{ matrix.shard }}/4
      - if: failure()
        run: docker compose logs api sync
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ matrix.shard }}
          path: tests/e2e/playwright-report
          retention-days: 7
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-editing-${{ matrix.shard }}
          path: tests/e2e/output
          if-no-files-found: ignore
          retention-days: 30
