name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # hb-shape, the reference the shaping checks (#7) compare Skia's glyphs against.
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libharfbuzz-bin
      # The brand fonts of the AI draft test (#24), pinned by hash in tests/ai-drafts/fonts.json.
      - run: pnpm --filter @razzlr/ai-drafts fonts
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm --filter @razzlr/e2e exec playwright install --with-deps chromium
      # Postgres and the sync server for the live editing checks (#8), from this checkout.
      - run: docker compose up -d --wait
      - run: pnpm e2e
      - if: failure()
        run: docker compose logs sync
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: tests/e2e/playwright-report
          retention-days: 7
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: pixel-diffs
          path: tests/pixels/output
          if-no-files-found: ignore
          retention-days: 7
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-editing
          path: tests/e2e/output
          if-no-files-found: ignore
          retention-days: 30
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: webgl-vs-cpu
          path: tests/pixels/output/webgl-vs-cpu.md
          if-no-files-found: ignore
          retention-days: 30
